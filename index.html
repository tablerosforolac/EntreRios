*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--fondo);color:var(--tinta);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.franja{background:var(--verde);height:56px;flex:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.75rem;line-height:1.2;margin:0 0 12px}
p.intro{margin:0 0 24px;color:var(--muted)}
label{display:block;font-weight:700;margin-bottom:6px}
.campo{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--tinta);background:var(--tarjeta);border:1px solid var(--borde);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
button{font:inherit;font-weight:700;border-radius:8px;cursor:pointer;padding:10px 14px}
.ver{background:transparent;color:var(--verde-txt);border:1px solid var(--borde)}
.ingresar{margin-top:16px;width:100%;background:var(--verde);color:#fff;border:1px solid var(--verde)}
.ingresar:disabled{opacity:.7;cursor:progress}
.error{color:var(--error);font-weight:700;margin:12px 0 0;min-height:1.5em}
@media (max-width:480px){.tarjeta{padding:24px 18px}h1{font-size:1.5rem}}
</style>

<script>
(function(){
  var datos = JSON.parse(document.getElementById('datos').textContent);
  var clave = document.getElementById('clave'), ver = document.getElementById('ver');
  var btn = document.getElementById('ingresar'), err = document.getElementById('error');
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  ver.addEventListener('click', function(){
    var oculto = clave.type === 'password';
    clave.type = oculto ? 'text' : 'password';
    ver.textContent = oculto ? 'Ocultar' : 'Ver';
    ver.setAttribute('aria-pressed', oculto ? 'true' : 'false');
    clave.focus();
  });
  document.getElementById('form').addEventListener('submit', async function(ev){
    ev.preventDefault();
    err.textContent = '';
    if (!window.crypto || !crypto.subtle) { err.textContent = 'Este navegador no permite abrir el tablero.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando…';
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave.value), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:b64(datos.salt), iterations:datos.iter},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plano = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(datos.iv)}, key, b64(datos.ct));
      var html = new TextDecoder('utf-8').decode(plano);
      document.open(); document.write(html); document.close();
    } catch (e) {
      err.textContent = 'Clave incorrecta. Revisala e intentá de nuevo.';
      btn.disabled = false; btn.textContent = 'Ingresar';
      clave.select();
    }
  });
  clave.focus();
})();
</script>
